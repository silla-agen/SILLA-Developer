<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CITY HUNTERS IN YOUR AREA</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#050505;
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

/* BACKGROUND */

.background{

  position:fixed;
  inset:0;

  background:
  radial-gradient(circle at top,
  rgba(255,20,147,0.22),
  #000 60%);

  z-index:-1;
}

/* CONTAINER */

.container{

  width:90%;
  max-width:650px;

  margin:auto;

  padding-top:60px;

  text-align:center;
}

/* TITLE */

h1{

  font-size:3.2rem;

  letter-spacing:3px;

  margin-bottom:12px;

  color:#ff1493;

  text-shadow:
  0 0 10px #ff1493,
  0 0 30px rgba(255,20,147,0.7);
}

.subtitle{

  color:#ffb6d9;

  margin-bottom:40px;

  line-height:1.8;

  font-size:1.05rem;
}

/* COUNTER */

.counter-box{

  background:
  rgba(15,15,15,0.95);

  border:2px solid #ff1493;

  padding:30px;

  border-radius:24px;

  margin-bottom:35px;

  box-shadow:
  0 0 25px rgba(255,20,147,0.25);
}

#counter{

  font-size:3.2rem;

  font-weight:bold;

  color:#ff1493;

  text-shadow:
  0 0 14px rgba(255,20,147,0.8);
}

.counter-text{

  color:#ffcce6;

  margin-top:10px;

  letter-spacing:1px;
}

/* FORM */

form{

  display:flex;

  flex-direction:column;

  gap:15px;
}

input{

  padding:16px;

  border-radius:14px;

  border:1px solid #333;

  background:#111;

  color:white;

  font-size:1rem;

  transition:0.3s;
}

input:focus{

  outline:none;

  border:1px solid #ff1493;

  box-shadow:
  0 0 16px rgba(255,20,147,0.4);
}

/* BUTTON */

button{

  padding:16px;

  border:none;

  border-radius:14px;

  background:#ff1493;

  color:white;

  font-size:1rem;

  font-weight:bold;

  cursor:pointer;

  transition:0.3s;

  box-shadow:
  0 0 20px rgba(255,20,147,0.35);
}

button:hover{

  transform:scale(1.04);

  background:#ff3aa3;

  box-shadow:
  0 0 35px rgba(255,20,147,0.6);
}

/* LIVE FEED */

.feed-box{

  margin-top:40px;

  background:
  rgba(15,15,15,0.95);

  border:1px solid #ff1493;

  border-radius:22px;

  padding:22px;

  text-align:left;

  box-shadow:
  0 0 20px rgba(255,20,147,0.18);
}

.feed-title{

  margin-bottom:16px;

  color:#ff1493;

  font-size:1.1rem;

  letter-spacing:1px;
}

.feed-item{

  padding:12px 0;

  border-bottom:1px solid #222;

  color:#ffd6ea;
}

/* SHARE BUTTON */

.share-btn{

  margin-top:25px;

  width:100%;
}

/* FOOTER */

.footer{

  margin-top:40px;

  margin-bottom:30px;

  color:#ff8fc7;

  font-size:0.9rem;

  letter-spacing:2px;
}

/* MOBILE */

@media(max-width:600px){

  h1{
    font-size:2.2rem;
  }

  #counter{
    font-size:2.4rem;
  }

}

</style>
</head>

<body>

<div class="background"></div>

<div class="container">

<h1>CITY HUNTERS</h1>

<p class="subtitle">
Sign the petition to bring the
CITY HUNTERS world tour
to your city.
</p>

<!-- COUNTER -->

<div class="counter-box">

  <div id="counter">
    1,284,920
  </div>

  <div class="counter-text">
    FANS HAVE SIGNED
  </div>

</div>

<!-- FORM -->

<form id="petitionForm">

  <input
  type="text"
  id="name"
  placeholder="Your Name"
  required>

  <input
  type="text"
  id="country"
  placeholder="Your Country"
  required>

  <button type="submit">
    SIGN THE PETITION
  </button>

</form>

<!-- LIVE FEED -->

<div class="feed-box">

  <div class="feed-title">
    LIVE ACTIVITY
  </div>

  <div id="feed"></div>

</div>

<!-- SHARE -->

<button
class="share-btn"
id="shareBtn">

SHARE THIS PETITION

</button>

<div class="footer">
CITY HUNTERS WORLD MOVEMENT
</div>

</div>

<script>

const form =
document.getElementById("petitionForm");

const counter =
document.getElementById("counter");

const feed =
document.getElementById("feed");

const shareBtn =
document.getElementById("shareBtn");

let count = 1284920;

/* SIGNING */

form.addEventListener("submit",
function(e){

e.preventDefault();

const name =
document.getElementById("name").value;

const country =
document.getElementById("country").value;

count++;

counter.innerText =
count.toLocaleString();

const div =
document.createElement("div");

div.classList.add("feed-item");

div.innerText =
`${name} from ${country} just signed.`;

feed.prepend(div);

form.reset();

});

/* FAKE LIVE USERS */

const fakePeople = [

["Alex","Brazil"],
["Maya","Kenya"],
["Leo","France"],
["Amina","Tanzania"],
["Kai","Japan"],
["David","USA"],
["Sofia","Spain"],
["Noah","Germany"],
["Lina","South Korea"]

];

setInterval(() => {

const random =

fakePeople[
Math.floor(
Math.random()
* fakePeople.length
)
];

count++;

counter.innerText =
count.toLocaleString();

const div =
document.createElement("div");

div.classList.add("feed-item");

div.innerText =
`${random[0]} from ${random[1]} just signed.`;

feed.prepend(div);

if(feed.children.length > 7){

feed.removeChild(feed.lastChild);

}

}, 4000);

/* SHARE BUTTON */

shareBtn.addEventListener("click",
() => {

navigator.clipboard.writeText(
window.location.href
);

alert("Petition link copied!");

});

</script>

</body>
</html>
